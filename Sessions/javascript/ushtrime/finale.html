<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>To-Do Dashboard</title>
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<style>
    body {
        margin: 0;
        font-family: 'Arial', sans-serif;
        background: #f0f2f5;
    }

    .sidebar {
        position: fixed;
        top: 0;
        left: 0;
        height: 100%;
        width: 220px;
        background-color: #2c3e50;
        color: white;
        padding: 20px;
        box-sizing: border-box;
    }

    .sidebar h2 {
        margin-bottom: 30px;
        font-size: 24px;
    }

    .sidebar ul {
        list-style: none;
        padding: 0;
    }

    .sidebar ul li {
        margin: 15px 0;
        cursor: pointer;
        transition: all 0.2s;
        padding: 5px 10px;
        border-radius: 5px;
    }

    .sidebar ul li:hover, .sidebar ul li.active {
        background-color: #18bc9c;
        color: white;
    }


    .main-content {
        margin-left: 240px;
        padding: 30px;
    }

    .dashboard-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .dashboard-header h1 {
        margin: 0;
        font-size: 28px;
    }

    .add-task-btn {
        background-color: #18bc9c;
        border: none;
        color: white;
        padding: 10px 20px;
        border-radius: 5px;
        cursor: pointer;
        font-weight: bold;
    }

    .add-task-btn:hover {
        background-color: #15a589;
    }

    .tasks-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
        gap: 20px;
        margin-top: 30px;
    }

    .task-card {
        background-color: white;
        border-radius: 10px;
        padding: 20px;
        box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        position: relative;
    }

    .task-card h3 {
        margin: 0 0 10px 0;
        font-size: 18px;
    }

    .task-card p {
        margin: 5px 0;
        color: #555;
        font-size: 14px;
    }

    .task-card .task-icons {
        position: absolute;
        top: 10px;
        right: 10px;
        display: flex;
        gap: 10px;
    }

    .task-icons span {
        cursor: pointer;
        color: #2c3e50;
        transition: all 0.2s;
    }

    .task-icons span:hover {
        color: #18bc9c;
    }

    .task-done h3 {
        text-decoration: line-through;
        color: gray;
    }


    .modal {
        display: none;
        position: fixed;
        z-index: 1000;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        overflow: auto;
        background-color: rgba(0,0,0,0.5);
    }

    .modal-content {
        background-color: #fefefe;
        margin: 10% auto;
        padding: 20px;
        border-radius: 10px;
        width: 300px;
        position: relative;
    }

    .modal-content h2 {
        margin-top: 0;
    }

    .modal-content label {
        display: block;
        margin: 10px 0 5px;
    }

    .modal-content input, .modal-content select {
        width: 100%;
        padding: 5px;
        box-sizing: border-box;
    }

    .modal-content button {
        margin-top: 15px;
        padding: 10px 15px;
        border: none;
        background-color: #18bc9c;
        color: white;
        cursor: pointer;
        border-radius: 5px;
        font-weight: bold;
    }

    .modal-content button:hover {
        background-color: #15a589;
    }

    .close-modal {
        position: absolute;
        top: 10px;
        right: 15px;
        font-size: 20px;
        cursor: pointer;
    }
</style>
</head>
<body>

<div class="sidebar">
    <h2>To-Do Dashboard</h2>
    <ul>
        <li class="active" data-filter="all">All Tasks</li>
        <li data-filter="today">Today</li>
        <li data-filter="important">Important</li>
        <li data-filter="completed">Completed</li>
    </ul>
</div>

<div class="main-content">
    <div class="dashboard-header">
        <h1>My Tasks</h1>
        <button class="add-task-btn">+ Add Task</button>
    </div>

    <div class="tasks-grid" id="tasksGrid">
     
    </div>
</div>

<div class="modal" id="taskModal">
    <div class="modal-content">
        <span class="close-modal" id="closeModal">&times;</span>
        <h2 id="modalTitle">Add Task</h2>
        <label for="taskTitle">Title</label>
        <input type="text" id="taskTitle">

        <label for="taskDue">Due Date</label>
        <input type="datetime-local" id="taskDue">

        <label for="taskPriority">Priority</label>
        <select id="taskPriority">
            <option value="Low">Low</option>
            <option value="Medium">Medium</option>
            <option value="High">High</option>
        </select>

        <button id="saveTaskBtn">Save</button>
    </div>
</div>
