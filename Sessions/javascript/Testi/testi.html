<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Student Manager</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", sans-serif;
        }

        body {
            background: linear-gradient(135deg, #667eea, #764ba2);
            padding: 40px 10px;
            min-height: 100vh;
        }

        .wrapper {
            max-width: 900px;
            margin: auto;
            background: #fff;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.1);
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .top-bar h2 {
            color: #1e293b;
        }

        button {
            background: #4f46e5;
            color: white;
            border: none;
            padding: 10px 16px;
            font-size: 15px;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #4338ca;
        }

        .search-box input {
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #cbd5e1;
            outline: none;
            font-size: 14px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            font-size: 15px;
        }

        th,
        td {
            padding: 12px;
            border: 1px solid #e2e8f0;
            text-align: center;
        }

        th {
            background: #eef2ff;
            color: #1e293b;
        }

        td img {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            object-fit: cover;
        }

        .badge {
            padding: 6px 10px;
            border-radius: 12px;
            color: #fff;
            font-weight: bold;
        }

        .badge.good {
            background: #22c55e;
        }

        .badge.average {
            background: #facc15;
        }

        .badge.poor {
            background: #ef4444;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            z-index: 999;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: #fff;
            width: 420px;
            border-radius: 16px;
            overflow: hidden;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(0.9);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .modal header {
            background: #4f46e5;
            color: white;
            padding: 15px;
            font-size: 18px;
        }

        .modal main {
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .modal main input,
        .modal main select {
            padding: 10px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
        }

        .modal footer {
            padding: 15px;
            text-align: right;
            background: #f9fafb;
        }

        .modal footer button:first-child {
            background: #94a3b8;
        }

        .modal footer button:first-child:hover {
            background: #64748b;
        }

        @media(max-width:600px) {
            .wrapper {
                padding: 20px;
            }

            .modal-content {
                width: 90%;
            }
        }
    </style>
</head>

<body>
    <div class="wrapper">
        <div class="top-bar">
            <h2>🎓 Student Manager</h2>
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Search students...">
                <button id="addBTN">+ Add Student</button>
            </div>
        </div>
        <table>
            <thead>
                <tr>
                    <th>Year</th>
                    <th>Name</th>
                    <th>Photo</th>
                    <th>GPA</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="allStudents"></tbody>
        </table>
    </div>

    <div class="modal" id="studentModal">
        <div class="modal-content">
            <header>
                <h3 id="modalTitle">Add Student</h3>
            </header>
            <main>
                <input type="number" id="year" placeholder="Year">
                <input type="text" id="studentName" placeholder="Student Name">
                <select id="thumb">
                    <option value="studenti.png">Male</option>
                    <option value="studente.png">Female</option>
                </select>
                <input type="number" id="gpa" step="0.1" placeholder="GPA">
            </main>
            <footer>
                <button id="cancelBTN">Cancel</button>
                <button id="submitBTN">Save</button>
            </footer>
        </div>
    </div>

    <script>
        let allData = [
            { year: "2024", name: "John Doe", thumb: "studenti.png", gpa: "3.8" },
            { year: "2023", name: "Anna Smith", thumb: "studente.png", gpa: "2.7" }
        ];

        const allStudents = document.querySelector("#allStudents");

        const addBTN = document.querySelector("#addBTN");
        const studentModal = document.querySelector("#studentModal");
        const cancelBTN = document.querySelector("#cancelBTN");
        const submitBTN = document.querySelector("#submitBTN");

        const year = document.querySelector("#year");
        const studentName = document.querySelector("#studentName");
        const thumb = document.querySelector("#thumb");
        const gpa = document.querySelector("#gpa");
        const modalTitle = document.querySelector("#modalTitle");

        const searchInput = document.querySelector("#searchInput");

        let editAction = false;
        let currentStudent = null;


        function listTable(filteredList = allData) {
            let recordsHTML = '';

            filteredList.forEach((s, index) => {
                let gpaValue = parseFloat(s.gpa);
                let badgeClass = "";

                if (gpaValue >= 3.5) badgeClass = "good";
                else if (gpaValue >= 2.5) badgeClass = "average";
                else badgeClass = "poor";

                recordsHTML += `
                <tr>
                    <td>${s.year}</td>
                    <td>${s.name}</td>
                    <td><img src="${s.thumb}"></td>
                    <td><span class="badge ${badgeClass}">${s.gpa}</span></td>
                    <td>
                        <button onclick="editStudent(${index})">Edit</button>
                        <button onclick="removeStudent(${index})">Remove</button>
                    </td>
                </tr>`;
            });

            allStudents.innerHTML = recordsHTML;
        }

        listTable();


        searchInput.addEventListener("keyup", () => {
            const text = searchInput.value.toLowerCase();

            const filtered = allData.filter(s =>
                s.name.toLowerCase().includes(text) ||
                s.year.includes(text) ||
                s.gpa.includes(text)
            );

            listTable(filtered);
        });


        addBTN.addEventListener("click", () => {
            modalTitle.textContent = "Add Student";
            editAction = false;

            year.value = "";
            studentName.value = "";
            thumb.value = "studenti.png";
            gpa.value = "";

            studentModal.style.display = "flex";
        });

        function removeModal() {
            studentModal.style.display = "none";
        }
        cancelBTN.addEventListener("click", removeModal);


        submitBTN.addEventListener("click", () => {

            const studentObj = {
                year: year.value.trim(),
                name: studentName.value.trim(),
                thumb: thumb.value.trim(),
                gpa: gpa.value.trim()
            };

            if (!studentObj.year || !studentObj.name || !studentObj.gpa) {
                alert("Please fill all fields");
                return;
            }

            if (!editAction) {
                allData.push(studentObj);
            } else {
                allData[currentStudent] = studentObj;
            }

            listTable();
            removeModal();
        });

        function editStudent(index) {
            editAction = true;
            currentStudent = index;

            modalTitle.textContent = "Edit Student";

            const s = allData[index];

            year.value = s.year;
            studentName.value = s.name;
            thumb.value = s.thumb;
            gpa.value = s.gpa;

            studentModal.style.display = "flex";
        }


        function removeStudent(index) {
            if (confirm("Do you really want to remove this student")) {
                allData.splice(index, 1);
                listTable();
            }
        }
    </script>

</body>
</html>
